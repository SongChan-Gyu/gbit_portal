# 개발: docker compose up → MySQL + Next.js dev (소스 마운트로 자동 반영)
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hrm_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hrm_web}
      MYSQL_CHARSET: utf8mb4
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init.d:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-hrm_secret}@mysql:3306/${MYSQL_DATABASE:-hrm_web}
    depends_on:
      mysql:
        condition: service_healthy
    # DB 연결 재시도 후 마이그레이션 → 시드 → 개발 서버 기동
    command: ["sh", "/app/scripts/docker-wait-db.sh"]

volumes:
  mysql_data:
