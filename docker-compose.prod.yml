# 운영 배포: docker compose -f docker-compose.prod.yml up -d
# 환경변수는 .env 또는 서버에서 설정 (NEXTAUTH_URL, NEXTAUTH_SECRET, MYSQL_ROOT_PASSWORD 등)
services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hrm_web}
      MYSQL_CHARSET: utf8mb4
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init.d:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 운영에서는 3306 노출 안 해도 됨 (같은 compose 내부에서만 app이 접속)
    # ports: ["3306:3306"]

  app:
    build:
      context: .
      target: prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-hrm_web}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
