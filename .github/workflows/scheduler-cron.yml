name: Scheduler Cron (call HRM APIs)

on:
  workflow_dispatch:
  schedule:
    # KST(Asia/Seoul) 기준으로 맞추려면, UTC로 변환해서 넣어야 합니다.
    # GitHub cron은 UTC만 지원. KST 00:15 ≈ 전날 UTC 15:15.
    # tenure-check·생일반차 등에 넘기는 date는 TZ=Asia/Seoul 기준 오늘 날짜를 쓰는 것이 맞음(UTC date와 하루 어긋날 수 있음).
    - cron: "15 15 * * *"

concurrency:
  group: hrm-scheduler-cron
  cancel-in-progress: false

jobs:
  call-cron-apis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required secrets
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "Missing secrets.APP_URL (예: https://xxx.up.railway.app)"
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing secrets.CRON_SECRET"
            exit 1
          fi

      - name: Call /api/cron/monthly-accrual
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "${APP_URL}/api/cron/monthly-accrual" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -d '{}' | head -c 4000

      - name: Call /api/cron/tenure-check
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          TODAY_KST="$(TZ=Asia/Seoul date +%F)"
          curl -fsS -X POST "${APP_URL}/api/cron/tenure-check" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -d "{\"date\":\"${TODAY_KST}\",\"window\":0}" | head -c 4000

      - name: Call /api/cron/birthday-half
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          TODAY_KST="$(TZ=Asia/Seoul date +%F)"
          curl -fsS -X POST "${APP_URL}/api/cron/birthday-half" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -d "{\"date\":\"${TODAY_KST}\"}" | head -c 4000

      - name: Call /api/cron/jeju-deposit-deadline
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "${APP_URL}/api/cron/jeju-deposit-deadline" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -d '{}' | head -c 4000

